    savedAnswers.p3multiple.q27_28 = chk27;
    savedAnswers.p3multiple.q29_30 = chk29;
    for(let i=31;i<=40;i++) { let inp = document.querySelector(`input[name="q${i}"]`); if(inp) savedAnswers.p4[`q${i}`] = inp.value.trim(); }
  }

  function restoreToCurrent(part) {
    if(part===1) for(let i=1;i<=10;i++) { let inp = document.querySelector(`input[name="q${i}"]`); if(inp) inp.value = savedAnswers.p1[`q${i}`]||''; }
    if(part===2) {
      for(let i=11;i<=18;i++) { let inp = document.querySelector(`input[name="q${i}"]`); if(inp) inp.value = savedAnswers.p2text[`q${i}`]||''; }
      for(let i=19;i<=20;i++) { let radio = document.querySelector(`input[name="q${i}"][value="${savedAnswers.p2single[`q${i}`]}"]`); if(radio) radio.checked = true; }
    }
    if(part===3) {
      for(let i=21;i<=26;i++) { let radio = document.querySelector(`input[name="q${i}"][value="${savedAnswers.p3single[`q${i}`]}"]`); if(radio) radio.checked = true; }
      savedAnswers.p3multiple.q27_28.forEach(v=>{ let cb = document.querySelector(`input[name="q27_28"][value="${v}"]`); if(cb) cb.checked=true; });
      savedAnswers.p3multiple.q29_30.forEach(v=>{ let cb = document.querySelector(`input[name="q29_30"][value="${v}"]`); if(cb) cb.checked=true; });
      document.querySelectorAll('.group[data-limit]').forEach(g=>{ let limit=2, cbs=g.querySelectorAll('input'); let update=()=>{ let c=g.querySelectorAll('input:checked').length; cbs.forEach(cb=>{if(!cb.checked) cb.disabled=c>=limit;});}; update(); cbs.forEach(cb=>cb.addEventListener('change',update)); });
    }
    if(part===4) for(let i=31;i<=40;i++) { let inp = document.querySelector(`input[name="q${i}"]`); if(inp) inp.value = savedAnswers.p4[`q${i}`]||''; }
  }

  function showToast(msg) { let t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }
  function updateGlobalTimerDisplay() { let el=document.getElementById('globalTimerDisplay'); let m=Math.floor(globalTimerSeconds/60), s=globalTimerSeconds%60; el.textContent=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; if(reviewTimeoutId && !allPartsCompleted) el.classList.add('warning'); else el.classList.remove('warning'); }

  function stopCurrentAudio() { if(currentPlayingIdx !== null && audioElements[currentPlayingIdx]) { audioElements[currentPlayingIdx].pause(); audioElements[currentPlayingIdx].currentTime = 0; } }

  function markPartSubmitted(part) {
    if(partStatus[part].submitted) return;
    partStatus[part].submitted = true;
    if(part-1 === currentPlayingIdx) stopCurrentAudio();
    showToast(`Part ${part} submitted early.`);
    if(document.getElementById('partContainer').dataset.currentPart == part) document.getElementById('partContainer').classList.add('disabled-input');
    restartPlaySequence();
  }

  function markPartFinishedAudio(part) { if(!partStatus[part].finishedAudio) { partStatus[part].finishedAudio = true; if(!partStatus[part].submitted) showToast(`Part ${part} audio finished.`); checkAllPartsCompletion(); } }

  function checkAllPartsCompletion() {
    let allDone = true;
    for(let p=1;p<=4;p++) if(!partStatus[p].submitted && !partStatus[p].finishedAudio) { allDone = false; break; }
    if(allDone && !allPartsCompleted) {
      allPartsCompleted = true;
      if(globalInterval) clearInterval(globalInterval);
      for(let t of scheduleTimeouts) clearTimeout(t);
      let hasEarly = Object.values(partStatus).some(st => st.submitted === true);
      if(hasEarly) finalizeResults(); else startReviewCountdown();
    }
  }

  function startReviewCountdown() {
    globalTimerSeconds = 120; updateGlobalTimerDisplay();
    if(globalInterval) clearInterval(globalInterval);
    globalInterval = setInterval(() => { if(globalTimerSeconds <= 0) { clearInterval(globalInterval); finalizeResults(); } else { globalTimerSeconds--; updateGlobalTimerDisplay(); } }, 1000);
    reviewTimeoutId = setTimeout(()=>{}, 121000);
  }

  function finalizeResults() {
    captureAllToSaved();
    if(reviewTimeoutId) clearTimeout(reviewTimeoutId);
    if(globalInterval) clearInterval(globalInterval);
    let container = document.getElementById('partContainer');
    let resultsDiv = container.querySelector('.results-in-page');
    if(resultsDiv) {
      let table = '<h4>📊 Final Answer Review</h4><table class="results-table"><thead><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></thead><tbody>';
      for(let i=1;i<=10;i++) { let u=savedAnswers.p1[`q${i}`]||'—'; let c=ANSWERS.p1[`q${i}`]; let ok=u.toLowerCase()===c.toLowerCase(); table += `<tr><td style="font-weight:600">${i}</td><td>${escapeHtml(u)}</td><td>${c}</td><td class="${ok?'result-correct':'result-incorrect'}">${ok?'✔ Correct':'✖ Incorrect'}</td></tr>`; }
      for(let i=11;i<=18;i++) { let u=savedAnswers.p2text[`q${i}`]||'—'; let c=ANSWERS.p2text[`q${i}`]; let ok=u.toLowerCase()===c.toLowerCase(); table += `<tr><td style="font-weight:600">${i}</td><td>${escapeHtml(u)}</td><td>${c}</td><td class="${ok?'result-correct':'result-incorrect'}">${ok?'✔ Correct':'✖ Incorrect'}</td></tr>`; }
      for(let i=19;i<=20;i++) { let u=savedAnswers.p2single[`q${i}`]||'—'; let c=ANSWERS.p2single[`q${i}`]; let ok=u===c; table += `<tr><td style="font-weight:600">${i}</td><td>${escapeHtml(u)}</td><td>${c}</td><td class="${ok?'result-correct':'result-incorrect'}">${ok?'✔ Correct':'✖ Incorrect'}</td></tr>`; }
      for(let i=21;i<=26;i++) { let u=savedAnswers.p3single[`q${i}`]||'—'; let c=ANSWERS.p3single[`q${i}`]; let ok=u===c; table += `<tr><td style="font-weight:600">${i}</td><td>${escapeHtml(u)}</td><td>${c}</td><td class="${ok?'result-correct':'result-incorrect'}">${ok?'✔ Correct':'✖ Incorrect'}</td></tr>`; }
      let u27 = savedAnswers.p3multiple.q27_28.sort().join(','); let c27 = ANSWERS.p3multiple.q27_28.sort().join(','); let ok27 = u27===c27; table += `<tr><td style="font-weight:600">27-28</td><td>${escapeHtml(u27||'—')}</td><td>${c27}</td><td class="${ok27?'result-correct':'result-incorrect'}">${ok27?'✔ Correct':'✖ Incorrect'}</td></tr>`;
      let u29 = savedAnswers.p3multiple.q29_30.sort().join(','); let c29 = ANSWERS.p3multiple.q29_30.sort().join(','); let ok29 = u29===c29; table += `<tr><td style="font-weight:600">29-30</td><td>${escapeHtml(u29||'—')}</td><td>${c29}</td><td class="${ok29?'result-correct':'result-incorrect'}">${ok29?'✔ Correct':'✖ Incorrect'}</td></tr>`;
      for(let i=31;i<=40;i++) { let u=savedAnswers.p4[`q${i}`]||'—'; let c=ANSWERS.p4[`q${i}`]; let ok=u.toLowerCase()===c.toLowerCase(); table += `<tr><td style="font-weight:600">${i}</td><td>${escapeHtml(u)}</td><td>${c}</td><td class="${ok?'result-correct':'result-incorrect'}">${ok?'✔ Correct':'✖ Incorrect'}</td></tr>`; }
      table += '</tbody></table>';
      resultsDiv.innerHTML = table;
    }
    showToast("Test completed. Final review displayed.");
  }

  function escapeHtml(s) { return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function attachInputCapture(part) {
    let inputs = document.querySelectorAll('input');
    inputs.forEach(inp => {
      inp.removeEventListener('input', captureAllToSaved);
      inp.removeEventListener('change', captureAllToSaved);
      inp.addEventListener('input', captureAllToSaved);
      inp.addEventListener('change', captureAllToSaved);
    });
  }

  function loadPart(part) {
    let container = document.getElementById('partContainer');
    container.dataset.currentPart = part;
    let html = part===1? PART1_HTML : part===2? PART2_HTML : part===3? PART3_HTML : PART4_HTML;
    container.innerHTML = html;
    document.getElementById('currentPartLabel').innerText = `Part ${part}`;
    if(partStatus[part].submitted) container.classList.add('disabled-input');
    else container.classList.remove('disabled-input');
    let btn = document.createElement('button'); btn.textContent = `Submit Part ${part}`; btn.className = 'part-submit-btn';
    btn.onclick = () => { if(!partStatus[part].submitted && !partStatus[part].finishedAudio) markPartSubmitted(part); else showToast(`Part ${part} already completed`); };
    let panel = container.querySelector('.group:last-child') || container;
    panel.insertAdjacentElement('afterend', btn);
    attachInputCapture(part);
    restoreToCurrent(part);
    captureAllToSaved();
    if(part===3) {
      document.querySelectorAll('.group[data-limit]').forEach(g=>{ let limit=2, cbs=g.querySelectorAll('input'); let update=()=>{ let c=g.querySelectorAll('input:checked').length; cbs.forEach(cb=>{if(!cb.checked) cb.disabled=c>=limit;}); captureAllToSaved();}; cbs.forEach(cb=>{cb.removeEventListener('change',update); cb.addEventListener('change',update);}); update();});
    }
  }

  function restartPlaySequence() {
    for(let t of scheduleTimeouts) clearTimeout(t);
    scheduleTimeouts = [];
    if(currentPlayingIdx !== null && audioElements[currentPlayingIdx]) audioElements[currentPlayingIdx].pause();
    let startIdx = 0;
    while(startIdx < 4 && (partStatus[startIdx+1].submitted || partStatus[startIdx+1].finishedAudio)) startIdx++;
    if(startIdx >= 4) { checkAllPartsCompletion(); return; }
    playNextPart(startIdx);
  }

  function playNextPart(idx) {
    if(idx >= 4) { checkAllPartsCompletion(); return; }
    let partNum = idx+1;
    if(partStatus[partNum].submitted || partStatus[partNum].finishedAudio) { playNextPart(idx+1); return; }
    currentPlayingIdx = idx;
    let audio = new Audio(AUDIO_FILES[idx]);
    audioElements[idx] = audio;
    audio.play().catch(e => console.warn("Auto-play blocked? User interaction required. But exam start handles it."));
    let timeoutId = setTimeout(() => {
      if(audio && !partStatus[partNum].submitted) { audio.pause(); markPartFinishedAudio(partNum); }
      playNextPart(idx+1);
    }, DURATIONS[idx]*1000);
    scheduleTimeouts.push(timeoutId);
  }

  function earlySubmitAllHandler() {
    if(!examStarted) { showToast("Test not started yet."); return; }
    if(confirm("Early submit all parts? Test will end immediately.")) {
      for(let i=0;i<4;i++) if(audioElements[i]) { audioElements[i].pause(); audioElements[i].currentTime=0; }
      for(let p=1;p<=4;p++) if(!partStatus[p].submitted && !partStatus[p].finishedAudio) partStatus[p].submitted = true;
      finalizeResults();
    }
  }

  function startExam() {
    if(examStarted) return;
    examStarted = true;
    document.getElementById('startOverlay')?.remove();
    document.getElementById('globalEarlySubmitBtn').disabled = false;
    document.querySelectorAll('.part-btn').forEach(btn => btn.disabled = false);
    loadPart(1);
    playNextPart(0);
    globalInterval = setInterval(()=>{ if(!allPartsCompleted && !reviewTimeoutId) globalTimerSeconds++; updateGlobalTimerDisplay(); }, 1000);
  }

  function init() {
    let overlay = document.createElement('div'); overlay.id = 'startOverlay'; overlay.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); backdrop-filter:blur(6px); z-index:1000; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:30px;';
    overlay.innerHTML = `<div style="background:var(--panel-white); padding:24px 48px; border-radius:60px; color:var(--primary-green); font-weight:500;">🎧 Click START to begin the full listening test</div><button id="startExamBtn" style="background:var(--primary-green); color:white; font-size:2rem; padding:20px 50px; border-radius:60px; border:none; cursor:pointer;">▶ START TEST</button><div style="background:var(--panel-white); padding:16px 32px; border-radius:40px; font-size:0.85rem;">P1: 8min | P2: 7min30s | P3: 7min26s | P4: 7min | +2min review</div>`;
    document.body.appendChild(overlay);
    document.getElementById('startExamBtn').addEventListener('click', () => { overlay.remove(); startExam(); });
    loadPart(1);
    document.querySelectorAll('.part-btn').forEach(btn => btn.addEventListener('click', (e) => { if(examStarted) loadPart(parseInt(e.target.dataset.part)); else showToast("Start the test first."); }));
    document.getElementById('globalEarlySubmitBtn').addEventListener('click', earlySubmitAllHandler);
    document.getElementById('toggle-notes-btn').addEventListener('click',()=>document.body.classList.toggle('notes-open'));
    document.getElementById('notes-close').addEventListener('click',()=>document.body.classList.remove('notes-open'));
    document.getElementById('globalEarlySubmitBtn').disabled = true;
    document.querySelectorAll('.part-btn').forEach(btn => btn.disabled = true);
  }
  init();
</script>
</body>
</html>
